version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      all-pip:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      all-github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      all-docker:
        patterns: ["*"]

  # npm / site: SECURITY updates only. `open-pull-requests-limit: 0` switches OFF
  # version updates for this ecosystem, so this adds no routine PR volume -- it
  # exists purely to GROUP the security PRs GitHub opens regardless of config.
  #
  # Security updates fire even with no matching `updates:` entry, and a `groups:`
  # block only applies to VERSION updates unless it sets `applies-to:
  # security-updates`. Ungrouped, every advisory against the shared
  # site/package-lock.json opens its own PR; those PRs all rewrite that one
  # lockfile, so they conflict with each other and every merge forces the rest to
  # rebase. Coupled peers (astro + @astrojs/starlight + sharp) have to move together or the
  # `npm ci` in pages.yml resolves an inconsistent tree. Grouping clears them in
  # a single PR.
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      site-security:
        applies-to: security-updates
        # Majors stay OUT of the group. Grouping a major with safe patches makes
        # the whole PR unmergeable until someone takes the framework upgrade --
        # measured here 2026-09-17, when astro 5->7 stranded postcss-selector-parser,
        # svgo, js-yaml and smol-toml at their vulnerable versions on main.
        update-types: ["minor", "patch"]
        patterns: ["*"]
