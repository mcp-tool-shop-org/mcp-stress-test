[project]
name = "mcp-stress-test"
version = "0.1.0"
description = "Stress testing framework for MCP security tools - simulating attacks, temporal degradation, and edge cases"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "MCP Tool Shop Team" }
]
keywords = ["mcp", "security", "testing", "stress-test", "llm", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.1.0",
    "pyright>=1.1.350",
    "pre-commit>=3.6.0",
]
cwm = [
    "context-window-manager>=0.6.0",
]
fuzzing = [
    "ollama>=0.1.0",
]
distributed = [
    "redis>=5.0.0",
    "celery>=5.3.0",
]

[project.scripts]
mcp-stress = "mcp_stress_test.cli:main"

[project.urls]
Homepage = "https://github.com/mcp-tool-shop/mcp-stress-test"
Documentation = "https://github.com/mcp-tool-shop/mcp-stress-test#readme"
Repository = "https://github.com/mcp-tool-shop/mcp-stress-test"
Issues = "https://github.com/mcp-tool-shop/mcp-stress-test/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_stress_test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=mcp_stress_test --cov-report=term-missing"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["tests"]
